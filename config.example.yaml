# Panduan tanda konfigurasi:
# - [WAJIB DIUBAH] Ganti sebelum pertama kali menjalankan layanan.
# - [SESUAI KEBUTUHAN] Ubah hanya jika metode deployment berbeda.
# - [BIASANYA JANGAN DIUBAH] Nilai default sudah direkomendasikan.
server:
  listen: "127.0.0.1:8000"
  maxBodyBytes: 33554432
  readTimeout: 15m
  requestTimeout: 2h
  swaggerEnabled: false
auth:
  accessTokenTTL: 15m
  refreshTokenTTL: 720h
  secureCookies: false
secrets:
  # Minimal 32 karakter. Buat dengan: openssl rand -hex 32
  jwtSecret: "replace-with-at-least-32-characters"
  # Kunci 32 byte Base64. Buat dengan: openssl rand -base64 32
  credentialEncryptionKey: "replace-with-base64-key"
bootstrapAdmin:
  username: "admin"
  # Ganti dengan password kuat sebelum deployment produksi.
  password: "replace-with-a-strong-password"
frontend:
  staticPath: "./frontend/dist"
database:
  driver: sqlite # sqlite | postgres
  sqlite:
    path: "./data/backend.db"
  postgres:
    dsn: "postgres://user:password@127.0.0.1:5432/grok2api?sslmode=disable"
    maxOpenConns: 50
    maxIdleConns: 10
runtimeStore:
  driver: memory # memory | redis
  redis:
    address: "127.0.0.1:6379"
    username: ""
    password: ""
    database: 0
    keyPrefix: "grok2api:"
    tls: false
media:
  driver: local
  local:
    path: "./data/media"
routing:
  reasoningReplayEnabled: true
  reasoningReplayTTL: 1h
  reasoningReplayMaxEntries: 10240
